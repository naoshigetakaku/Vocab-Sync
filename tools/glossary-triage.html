<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glossary triage</title>
<style>
  :root{
    --bg:#ffffff; --text:#0b0b0b; --dim:#6e6e6e; --faint:#9a9a9a;
    --line:#e6e6e6; --known:#0E8A45; --known-tint:rgba(14,138,69,.13);
    --missed:#D42A2A; --missed-tint:rgba(212,42,42,.11); --card:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#202020; --text:#f2f2f2; --dim:#a8a8a8; --faint:#777;
      --line:#333; --known:#4FC98A; --known-tint:rgba(79,201,138,.16);
      --missed:#FF8080; --missed-tint:rgba(255,128,128,.15); --card:#2a2a2a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--faint)}
  .bar{height:3px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;margin:0 14px}
  .bar i{display:block;height:100%;background:var(--text);width:0;transition:width .2s}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;gap:18px}
  .word{font-size:clamp(32px,9vw,56px);font-weight:700;letter-spacing:-.03em;
    overflow-wrap:anywhere;margin:0}
  .pos{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .gloss{min-height:74px;display:flex;flex-direction:column;gap:4px;justify-content:center}
  .ja{font-size:24px;font-weight:600}
  .ro{font-size:15px;color:var(--dim)}
  .hint{font-size:13px;color:var(--faint)}
  .warn{font-size:12px;color:var(--faint);max-width:30em}
  footer{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
  button{font:inherit;border:0;border-radius:12px;height:58px;cursor:pointer;
    font-weight:650;font-size:16px;transition:transform .12s}
  button:active{transform:scale(.97)}
  .missed{background:var(--missed-tint);color:var(--missed)}
  .got{background:var(--known-tint);color:var(--known)}
  .ghost{background:transparent;color:var(--dim);border:1px solid var(--line);height:44px;font-size:14px}
  .row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .done{padding:24px;max-width:760px;margin:0 auto;width:100%}
  .done h1{font-size:26px;margin:0 0 6px}
  .done p{color:var(--dim);margin:0 0 18px}
  textarea{width:100%;height:280px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat{display:flex;gap:22px;margin-bottom:18px;font-size:15px}
  .stat b{font-size:26px;display:block;font-weight:700}
  .hidden{display:none}
</style>
</head>
<body>

<header>
  <span id="count">0 / 0</span>
  <span class="bar"><i id="fill"></i></span>
  <button class="ghost" id="restart" style="height:30px;padding:0 12px">Restart</button>
</header>

<main id="card">
  <span class="pos" id="pos"></span>
  <h1 class="word" id="word"></h1>
  <div class="gloss">
    <div id="gloss" class="hidden">
      <div class="ja" id="ja"></div>
      <div class="ro" id="ro"></div>
    </div>
    <div class="hint" id="hint">Tap or press Enter to see the Japanese</div>
  </div>
  <p class="warn">The Japanese is read off the scan automatically and is wrong
     here and there. Judge by the English.</p>
</main>

<footer>
  <div class="acts">
    <button class="missed" id="bMissed">Missed &nbsp;&larr;</button>
    <button class="got" id="bGot">&rarr;&nbsp; Got it</button>
  </div>
  <div class="row"><button class="ghost" id="bBack">Undo last</button></div>
</footer>

<section class="done hidden" id="done">
  <h1>Done</h1>
  <p id="summary"></p>
  <div class="stat">
    <span>Missed<b id="nMissed">0</b></span>
    <span>Got it<b id="nGot">0</b></span>
  </div>
  <p>Paste this into the <b>Inbox</b> tab of the VocabSync spreadsheet (cell A1),
     then run <code>previewInbox()</code> in the Apps Script editor.</p>
  <div class="row" style="justify-content:flex-start;margin:0 0 10px">
    <button class="ghost" id="bCopy">Copy</button>
    <button class="ghost" id="bAgain">Go through the missed ones again</button>
    <button class="ghost" id="bReset">Start over</button>
  </div>
  <textarea id="out" readonly></textarea>
</section>

{"w":"Applied","j":"応用数学","r":"örösugaku","p":"Noun","g":"p4"},{"w":"Mathematical","j":"数理物理","r":"süributsuri","p":"Noun","g":"p4"},{"w":"Numerical Analysis EtAFfF","j":"粉估绍","r":"süchikaiseki","p":"Expression","g":"p4"},{"w":"Probability","j":"在 玄门","r":"kakuritsu","p":"Noun","g":"p4"},{"w":"Statistics","j":"統計","r":"tokei","p":"Noun","g":"p4"},{"w":"77","j":"","r":"","p":"Noun","g":"p4"}];
const KEY = 'glossary-triage.v1';

let state = load();

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.queue) && s.total === WORDS.length) return s;
  }catch(e){}
  return fresh(WORDS.map((_, i) => i));
}
function fresh(queue){
  return { total: WORDS.length, queue, at: 0, missed: [], got: [], log: [] };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const $ = (id) => document.getElementById(id);
let revealed = false;

function render(){
  const left = state.queue.length - state.at;
  if (left <= 0) return finish();

  $('done').classList.add('hidden');
  $('card').style.display = '';
  document.querySelector('footer').style.display = '';
  document.querySelector('header').style.display = '';

  const w = WORDS[state.queue[state.at]];
  $('word').textContent = w.w;
  $('pos').textContent = w.p;
  $('ja').textContent = w.j || '—';
  $('ro').textContent = w.r || '';
  revealed = false;
  $('gloss').classList.add('hidden');
  $('hint').classList.remove('hidden');

  $('count').textContent = (state.at + 1) + ' / ' + state.queue.length;
  $('fill').style.width = (state.at / state.queue.length * 100) + '%';
  $('bBack').disabled = state.log.length === 0;
}

function reveal(){
  revealed = true;
  $('gloss').classList.remove('hidden');
  $('hint').classList.add('hidden');
}

function answer(ok){
  const idx = state.queue[state.at];
  (ok ? state.got : state.missed).push(idx);
  state.log.push([idx, ok]);
  state.at += 1;
  save();
  render();
}

function undo(){
  if (!state.log.length) return;
  const [idx, ok] = state.log.pop();
  const pile = ok ? state.got : state.missed;
  const at = pile.lastIndexOf(idx);
  if (at !== -1) pile.splice(at, 1);
  state.at = Math.max(0, state.at - 1);
  save();
  render();
}

function tsv(){
  const rows = state.missed.map((i) => {
    const w = WORDS[i];
    const def = [w.j, w.r ? '(' + w.r + ')' : ''].filter(Boolean).join(' ');
    return [w.w, w.p, def, ''].join('\t');
  });
  return rows.join('\n');
}

function finish(){
  $('card').style.display = 'none';
  document.querySelector('footer').style.display = 'none';
  document.querySelector('header').style.display = 'none';
  $('done').classList.remove('hidden');
  $('nMissed').textContent = state.missed.length;
  $('nGot').textContent = state.got.length;
  const pct = state.queue.length ? Math.round(state.got.length / state.queue.length * 100) : 0;
  $('summary').textContent = state.queue.length + ' words · ' + pct + '% known';
  $('out').value = tsv();
}

$('bGot').onclick = () => answer(true);
$('bMissed').onclick = () => answer(false);
$('bBack').onclick = undo;
$('card').onclick = (e) => { if (!e.target.closest('button')) reveal(); };
$('restart').onclick = () => { if (confirm('Start over from the first word?')) { state = fresh(WORDS.map((_,i)=>i)); save(); render(); } };
$('bReset').onclick = () => { state = fresh(WORDS.map((_,i)=>i)); save(); render(); };
$('bAgain').onclick = () => {
  if (!state.missed.length) return;
  state = fresh(state.missed.slice());
  save(); render();
};
$('bCopy').onclick = async () => {
  const t = $('out');
  try{ await navigator.clipboard.writeText(t.value); $('bCopy').textContent = 'Copied'; }
  catch(e){ t.select(); document.execCommand('copy'); $('bCopy').textContent = 'Copied'; }
  setTimeout(() => { $('bCopy').textContent = 'Copy'; }, 1400);
};

document.addEventListener('keydown', (e) => {
  if (!$('done').classList.contains('hidden')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); answer(true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); answer(false); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); revealed ? answer(true) : reveal(); }
  else if (e.key === 'Backspace') { e.preventDefault(); undo(); }
});

render();
</script>
